name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # System prerequisite: GSL (not pip-installable) + pkg-config for discovery.
      - name: Install GSL
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev pkg-config

      # torch is a documented prerequisite (installed separately from the package
      # deps); use the CPU wheel index so no CUDA is pulled on the runner.
      # The upper bound is deliberate. Unpinned, this line rolls onto every new torch
      # release, and the fit's numerics move with the LAPACK build underneath it: a
      # release once turned test_infer's marginal eigendecompositions non-finite one
      # LBFGS step earlier and reddened CI with no code change on our side. Raise the
      # bound when you have run the suite against the newer torch, not before.
      - name: Install PyTorch (CPU)
        run: pip install "torch>=2.1,<2.14" --index-url https://download.pytorch.org/whl/cpu

      # Non-editable, so this doubles as the packaging smoke test: it proves the
      # wheel builds and that `pip install diff_fret_likelihood` works for a user.
      - name: Install package (with dev extras)
        run: pip install ".[dev]"

      # The install above puts the compiled extensions in site-packages, but
      # tests/conftest.py prepends the SOURCE TREE to sys.path (so edits are what gets
      # tested) and *.so is gitignored -- so the tree must carry them too. Without this
      # `diff_fret_likelihood.simulator` is missing from the copy pytest imports and
      # every simulator test skips (or errors) while CI stays green.
      # setuptools/Cython are named explicitly: the install above resolved them inside
      # pip's isolated build env, so they are absent from the runtime env.
      - name: Build the Cython extensions in place
        run: |
          pip install "setuptools>=64" "Cython>=3.0"
          python build_cython.py

      # Mirrors conftest's sys.path insert, so it checks the copy pytest will import.
      # Turns a build regression into a loud failure instead of 13 silent skips.
      - name: Verify the in-place extensions import
        run: |
          python -c "import sys; sys.path.insert(0, '..'); \
            import diff_fret_likelihood.simulator as s, diff_fret_likelihood.doob_tpt as d; \
            print(s.__file__); print(d.__file__)"

      # `slow` = test_bartlett_fisher, whose 300 traces are ~10 min of simulation on a
      # 2-core runner with an always-cold cache. Run it locally:
      #   pytest tests/test_bartlett_fisher.py -s
      - name: Run tests (excluding the slow statistical tests)
        run: python -m pytest tests -q -m "not slow"
